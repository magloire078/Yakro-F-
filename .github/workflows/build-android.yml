name: Build Android App Bundle

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'public/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build & Sign Android Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore Keystore from Secret or Fallback
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from repository secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/yakro-release-key.jks
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found. Generating standalone release keystore..."
            keytool -genkeypair -v -keystore android/app/yakro-release-key.jks \
              -alias yakro-key-alias -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass yakrofe2026 -keypass yakrofe2026 \
              -dname "CN=Yakro-Fe, OU=Mobile, O=Yakro-Fe, L=Yamoussoukro, ST=Lacs, C=CI"
          fi

      - name: Build Android App Bundle (.aab) & APK (.apk)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'yakrofe2026' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'yakro-key-alias' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'yakrofe2026' }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Android App Bundle artifact (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: yakro-fe-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android APK artifact (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: yakro-fe-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
