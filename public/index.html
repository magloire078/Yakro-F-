<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yakro-Fê</title>
    <meta name="theme-color" content="#0A0A0B">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0A0A0B;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            overflow: hidden;
        }
        .container {
            max-width: 360px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeIn 0.6s ease-out;
        }
        .logo-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(249, 115, 22, 0.05));
            border: 1px solid rgba(249, 115, 22, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px -15px rgba(249, 115, 22, 0.3);
        }
        .logo-img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            object-fit: contain;
        }
        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            font-style: italic;
        }
        .brand-title span {
            color: #F97316;
        }
        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
            margin-top: -12px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(249, 115, 22, 0.15);
            border-top-color: #F97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .offline-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }
        .offline-title {
            font-size: 13px;
            color: #f87171;
            font-weight: 600;
        }
        .offline-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        .retry-btn {
            background: #F97316;
            color: #FFFFFF;
            border: none;
            padding: 12px 28px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            box-shadow: 0 10px 20px -5px rgba(249, 115, 22, 0.4);
        }
        .retry-btn:active {
            transform: scale(0.96);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrapper">
            <img src="/icons/icon-192x192.png" alt="Yakro-Fê" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div>
            <h1 class="brand-title">Yakro-<span>Fê</span></h1>
            <p class="subtitle">Votre ville, livrée à Yamoussoukro</p>
        </div>
        <div class="spinner" id="spinner"></div>
        <div class="offline-box" id="offline-box">
            <p class="offline-title">Connexion Internet requise</p>
            <p class="offline-desc">Vérifiez votre connexion Wi-Fi ou vos données mobiles pour accéder au service.</p>
            <button class="retry-btn" onclick="retryConnect()">Réessayer</button>
        </div>
    </div>
    <script>
        const TARGET_URL = 'https://yakrofe.com';
        function checkAndRedirect() {
            if (navigator.onLine) {
                window.location.replace(TARGET_URL);
            } else {
                showOffline();
            }
        }
        function showOffline() {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('offline-box').style.display = 'flex';
        }
        function retryConnect() {
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('offline-box').style.display = 'none';
            setTimeout(checkAndRedirect, 400);
        }
        window.addEventListener('online', checkAndRedirect);
        // Tente la redirection immédiate
        checkAndRedirect();
        // Sécurité si hors ligne au bout de 4 secondes
        setTimeout(() => {
            if (window.location.href.includes('yakrofe.com')) return;
            if (!navigator.onLine) showOffline();
        }, 4000);
    </script>
</body>
</html>
